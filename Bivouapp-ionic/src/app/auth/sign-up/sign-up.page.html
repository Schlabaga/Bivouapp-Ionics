<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="welcome"></ion-back-button>
    </ion-buttons>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <h2>Bienvenue parmi nous !</h2>

    <ion-item lines="full">
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="email"></ion-input>
    </ion-item>

    <ion-item lines="full">
      <ion-label position="floating">Mot de passe</ion-label>
      <ion-input type="password" [(ngModel)]="password"></ion-input>
    </ion-item>


    <ion-item lines="full">
      <ion-label position="floating">Répéter le mot de passe</ion-label>
      <ion-input type="password" [(ngModel)]="password"></ion-input>
    </ion-item>


    <ion-item lines="full">
      <ion-label position="floating">Date de naissance</ion-label>
      <ion-input type="date" [(ngModel)]="date"></ion-input>
    </ion-item>


    <ion-button expand="block" (click)="handleSignUp()" class="ion-margin-top">
      S'inscrire
    </ion-button>

    <p class="ion-text-center">
      Tu as déjà un compte ? <a routerLink="/sign-in">Connecte-toi</a>
    </p>
  </div>
</ion-content>

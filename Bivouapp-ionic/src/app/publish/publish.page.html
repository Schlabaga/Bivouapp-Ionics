<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Partager un spot</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="spotForm" (ngSubmit)="onSubmit()">


  <div class="map-container">
    <div id="map-publish"></div>
    <ion-button class="gps-btn" expand="block" shape="round" color="secondary" (click)="getCurrentLocation()">
      <ion-icon slot="start" name="locate-outline"></ion-icon>
      Me géolocaliser
    </ion-button>
  </div>

  <ion-list lines="none" class="form-list">
    <ion-item class="custom-input">
      <ion-label position="stacked">Nom du spot (Optionnel)</ion-label>
      <ion-input formControlName="title" placeholder="Ex: Clairière aux étoiles"></ion-input>
    </ion-item>

    <ion-item class="custom-input">
      <ion-label position="stacked">Description *</ion-label>
      <ion-textarea formControlName="description" placeholder="Dis-nous en plus sur ce coin de paradis... (Obligatoire)" rows="3"></ion-textarea>
    </ion-item>
  </ion-list>

  <div class="section-container">
    <h3 class="section-title">Quel type d'hébergement ?</h3>
    <div class="grid-selector">
      <div *ngFor="let item of allLodging"
           [class.selected]="isLodgingSelected(item.id)"
           (click)="selectLodging(item.id)"
           class="selector-chip">
        <ion-icon [name]="item.icon"></ion-icon>
        <span class="chip-label">{{ item.label }}</span>
      </div>
    </div>
  </div>

  <ion-list lines="full" class="toggle-list">
    <ion-item>
      <ion-icon slot="start" name="train-outline" color="medium"></ion-icon>
      <ion-label>Accessible en train</ion-label>
      <ion-toggle formControlName="accessibleByTrain"></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon slot="start" name="cash-outline" color="medium"></ion-icon>
      <ion-label>Accès payant</ion-label>
      <ion-toggle formControlName="isPaid" (ionChange)="onPaidToggleChange($event)"></ion-toggle>
    </ion-item>

    <ion-item *ngIf="spotForm.get('isPaid')?.value" class="price-input animate__animated animate__fadeIn">
      <ion-label slot="start">Tarif (€)</ion-label>
      <ion-input type="number" formControlName="price" placeholder="0.00"></ion-input>
    </ion-item>
  </ion-list>

  <div class="section-container">
    <h3 class="section-title">Services disponibles sur place</h3>
    <div class="grid-selector">
      <div *ngFor="let service of allServices"
           [class.selected]="isServiceSelected(service.id)"
           (click)="toggleService(service.id)"
           class="selector-chip service-chip">
        <ion-icon [name]="service.icon"></ion-icon>
        <span class="chip-label">{{ service.label }}</span>
      </div>
    </div>
  </div>

  <div class="ion-margin-top">
    <ion-button type="submit" expand="block" color="success" class="submit-btn">
      <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
      Publier le spot
    </ion-button>
  </div>

  </form>
</ion-content>

<ion-content [fullscreen]="true">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/explore" text="" icon="chevron-back"></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar
    show-clear-button="always"
    placeholder="Rechercher une ville, un lieu..."
    class="custom-search">
  </ion-searchbar>

  <div id="map"></div>

  <ion-list class="display-spots">
    <ion-item></ion-item>
  </ion-list>

</ion-content>

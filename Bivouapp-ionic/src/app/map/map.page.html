<ion-content [fullscreen]="true">
  <ion-header class="ion-no-border">
    <ion-button class="back-btn" fill="clear" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>
  </ion-header>

  <div id="map"></div>

  <ion-modal class="modal-slide"
             [isOpen]="isModalOpen"
             [backdropDismiss]="false"
             [showBackdrop]="false"
             [initialBreakpoint]="0.20"
             [breakpoints]="[0.20, 0.5, 0.92]"
             [backdropBreakpoint]="0.92">
    <ng-template>

      @if (selectedSpot) {
        <app-spot-detail [spotId]="selectedSpot.id" (closed)="closeSpotDetail()"></app-spot-detail>
      } @else {

        <ion-header class="ion-no-border class-modal-header">

          <div class="sort-chips">
            @for (option of sortOptions; track option.id) {
              <div class="chip"
                   [class.active]="selectedSort === option.id"
                   (click)="selectSort(option.id)">
                <ion-icon [name]="option.icon"></ion-icon>
                <span>{{ option.label }}</span>
              </div>
            }
          </div>

          <div class="search-row">
            <ion-searchbar
              [(ngModel)]="searchQuery"
              placeholder="Rechercher un lieu..."
              class="map-searchbar"
              [debounce]="400"
              (ionInput)="onSearch($event)"
              (ionFocus)="maximizeModal()">
            </ion-searchbar>

            <ion-button fill="clear" class="filter-btn" (click)="openFilterSheet()">
              <ion-icon name="options-outline"></ion-icon>
              @if (activeFilterCount > 0) {
                <span class="filter-badge">{{ activeFilterCount }}</span>
              }
            </ion-button>
          </div>

        </ion-header>

        <ion-content class="ion-padding modal-list-content">
          <div class="expanded-zone">
            <ion-list lines="none" class="spots-list">
              <ion-item><ion-label>Spot 1</ion-label></ion-item>
              <ion-item><ion-label>Spot 2</ion-label></ion-item>
            </ion-list>
          </div>
        </ion-content>
      }

    </ng-template>
  </ion-modal>

  <!-- Modal filtres -->
  <ion-modal #filterModal [initialBreakpoint]="0.6" [breakpoints]="[0, 0.6]">
    <ng-template>
      <ion-content class="ion-padding">
        <h3 class="filter-title">Filtres</h3>

        <div class="filter-section">
          <label>Distance max : <strong>{{ maxDistance }} km</strong></label>
          <ion-range
            [(ngModel)]="maxDistance"
            min="1" max="100" step="1"
            color="primary">
          </ion-range>
        </div>

        <div class="filter-section">
          <label>Services</label>
          <div class="services-grid">
            @for (service of servicesFilters; track service.id) {
              <div class="service-chip"
                   [class.active]="service.checked"
                   (click)="service.checked = !service.checked">
                <ion-icon [name]="service.icon"></ion-icon>
                <span>{{ service.label }}</span>
              </div>
            }
          </div>
        </div>

        <ion-button expand="block" class="apply-btn" (click)="applyFiltersAndClose()">
          Appliquer
        </ion-button>

        <ion-button expand="block" fill="clear" color="medium" (click)="resetFilters()">
          Réinitialiser
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
